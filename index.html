<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DownFSH Tool — Multi-Platform Video Downloader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="bg-grid"></div>

  <header class="header">
    <div class="logo">
      <span class="logo-icon">⬇</span>
      <span class="logo-text">DownFSH Tool</span>
    </div>
    <p class="tagline">Download videos from any platform — all at once</p>
  </header>

  <main class="container">
    <section class="card input-card">
      <div class="card-header">
        <h2>Video Links</h2>
        <button type="button" id="addLinkBtn" class="btn btn-ghost">
          <span>+</span> Add Link
        </button>
      </div>

      <div id="linksContainer" class="links-container">
        <div class="link-row">
          <span class="link-number">1</span>
          <input type="url" class="link-input" placeholder="Paste video URL (YouTube, TikTok, Instagram, Twitter/X, Facebook…)" />
          <button type="button" class="btn-icon remove-btn" title="Remove" aria-label="Remove link">×</button>
        </div>
      </div>

      <div class="actions">
        <button type="button" id="downloadAllBtn" class="btn btn-primary">
          <span class="btn-icon-download">↓</span>
          Download All
        </button>
        <button type="button" id="clearAllBtn" class="btn btn-secondary">Clear All</button>
      </div>
    </section>

    <section class="card status-card" id="statusCard" hidden>
      <div class="card-header">
        <h2>Download Progress</h2>
        <span id="overallProgress" class="progress-badge">0 / 0</span>
      </div>
      <div id="statusList" class="status-list"></div>
    </section>

    <section class="platforms">
      <p class="platforms-label">Supported platforms include</p>
      <div class="platform-tags">
        <span>YouTube</span>
        <span>TikTok</span>
        <span>Instagram</span>
        <span>Twitter / X</span>
        <span>Facebook</span>
        <span>Vimeo</span>
        <span>1000+ more</span>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>© Rights Reserved — <strong>Mustafa Zakaria</strong></p>
  </footer>

  <div id="toast" class="toast" role="alert" aria-live="polite"></div>

  <script src="js/app.js"></script>
</body>
</html>
